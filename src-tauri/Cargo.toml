[package]
name = "i_net"
version = "0.6.0"
description = "A visualized personal sensitive data manager"
authors = ["Saya"]
repository = "https://github.com/kindabit/i-net"
edition = "2021"
default-run = "i_net"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "i_net_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["isolation"] }

[features]
# 仅供调试构建使用的 LLM 自动化 HTTP 服务器。每条代码路径都额外受
# `debug_assertions` 门控，因此发布构建即使误带该 feature 也绝不会包含本模块。
# 通过 `tauri:dev` 包脚本启用。
debug-automation = [
    "dep:axum",
    "dep:enigo",
    "dep:image",
    "dep:windows",
]

[dependencies]
tauri = { version = "2", features = ["isolation"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
directories = "6"
sys-locale = "0.3"
tokio = { version = "1", features = ["fs", "net", "rt-multi-thread", "macros", "sync", "time"] }
aes-gcm-siv = "0.12.0-rc.3"
sha2 = "0.11"
sysinfo = "0.39.2"
rusqlite = { version = "0.40.1", features = ["bundled", "serialize"] }
rand = "0.10.1"
# 启动期错误提示使用 rfd 原生阻塞对话框：启动阶段前端尚未就绪，
# 错误无法经 invoke 到达前端的受控崩溃通道。
rfd = { version = "0.16", default-features = false, features = ["common-controls-v6"] }
uuid = { version = "1", features = ["v4"] }
arboard = "3"
clap = { version = "4", features = ["derive"] }
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
infer = "0.22"
brotli = "8"
zstd = "0.13"
lzma-rust = "0.1.7"
flacenc = "0.5"
claxon = "0.4"
reed-solomon-erasure = "6"
tar = "0.4"
walkdir = "2"
sea-query = { version = "1", default-features = false, features = ["backend-sqlite", "derive"] }

# 以下依赖仅用于服务仅调试构建可用的 `debug-automation` feature。
# 自动化 API 的 HTTP 服务器（Tokio 项目，维护活跃）。
axum = { version = "0.8", optional = true }
# 操作系统级输入模拟（Windows 上使用 SendInput）；使原生 HTML5 拖放能够启动。
enigo = { version = "0.6", optional = true }
# 捕获窗口帧的 PNG 编码。
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
# 窗口几何 shim（窗口矩形、客户区原点、逐窗口 DPI）。
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
